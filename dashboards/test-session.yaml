# DEPRECATED — do not use this file directly.
#
# Entity IDs in this file assume the device-grouped naming pattern
# (`sensor.reef_tank_kh_latest`) which only applies to integration
# installs that started on v0.1.2 or later. Earlier installs (v0.1.0
# / v0.1.1) created entities like `sensor.kh_latest` (no prefix), and
# HA's entity registry keeps original IDs sticky — so this YAML
# pasted as-is will give "Entity not found" everywhere.
#
# Use the auto-installed dashboard at `/reef-tank-tracker` instead —
# the integration generates it dynamically against your entity
# registry, so it always references the actual entity IDs in your HA.
#
# If the auto-installed dashboard isn't appearing, run:
#     service: reeftanktracker.diagnose_dashboard
# and check the WARNING log lines for what's blocking the install.
#
# Or to force a rebuild:
#     service: reeftanktracker.regenerate_dashboard
