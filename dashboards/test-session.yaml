# Test Session card — drop into your dashboard's raw config editor as a
# new view, or paste this single section into an existing view.
#
# Each row is a number entry that auto-saves on change. The "Latest"
# tile next to it shows what's currently recorded for that parameter
# (most recent of manual / ICP / auto). Edit by typing a new value.
#
# Entity IDs are prefixed with `reef_tank_` because the integration
# groups everything under a single "Reef Tank" device. This makes them
# easy to find in HA: Settings → Devices → Reef Tank.

title: Reef Tank
views:
  - title: Test Session
    path: reef-test
    icon: mdi:flask
    type: sections
    max_columns: 3
    sections:

      # ─────────────────────────────────────────────────────────────
      # Tank context
      # ─────────────────────────────────────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Tank context
            icon: mdi:waves
          - type: tile
            entity: sensor.reef_tank_tank_habitat
            name: Habitat
            icon: mdi:waves
          - type: tile
            entity: sensor.reef_tank_tank_problem
            name: Problem
            icon: mdi:alert-circle-outline

      # ─────────────────────────────────────────────────────────────
      # Hanna run — auto-saves on each entry, edit by retyping
      # ─────────────────────────────────────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Test Session
            icon: mdi:flask
          - type: entities
            title: Auto-saves on entry
            show_header_toggle: false
            entities:
              - entity: number.reef_tank_kh_entry
                name: KH (dKH)
                secondary_info: last-updated
              - entity: number.reef_tank_calcium_entry
                name: Calcium (ppm)
                secondary_info: last-updated
              - entity: number.reef_tank_magnesium_entry
                name: Magnesium (ppm)
                secondary_info: last-updated
              - entity: number.reef_tank_phosphate_entry
                name: Phosphate (ppm)
                secondary_info: last-updated
              - entity: number.reef_tank_nitrate_entry
                name: Nitrate (ppm)
                secondary_info: last-updated
              - entity: number.reef_tank_salinity_entry
                name: Salinity (ppt)
                secondary_info: last-updated
              - entity: number.reef_tank_temperature_entry
                name: Temp (°C)
                secondary_info: last-updated

      # ─────────────────────────────────────────────────────────────
      # Latest known values
      # ─────────────────────────────────────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Latest values
            icon: mdi:chart-line
          - type: tile
            entity: sensor.reef_tank_kh_latest
            name: KH
            color: cyan
            vertical: true
            state_content:
              - state
              - last-changed
          - type: tile
            entity: sensor.reef_tank_calcium_latest
            name: Calcium
            vertical: true
          - type: tile
            entity: sensor.reef_tank_magnesium_latest
            name: Magnesium
            vertical: true
          - type: tile
            entity: sensor.reef_tank_phosphate_latest
            name: Phosphate
            vertical: true
          - type: tile
            entity: sensor.reef_tank_nitrate_latest
            name: Nitrate
            vertical: true
          - type: tile
            entity: sensor.reef_tank_salinity_latest
            name: Salinity
            vertical: true

      # ─────────────────────────────────────────────────────────────
      # Cadence / drift diagnostics
      # ─────────────────────────────────────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Cadence & drift
            icon: mdi:calendar-check
          - type: tile
            entity: sensor.reef_tank_kh_days_since
            name: KH last test
            vertical: true
          - type: tile
            entity: sensor.reef_tank_kh_drift
            name: KH drift vs auto
            vertical: true
          - type: tile
            entity: sensor.reef_tank_calcium_days_since
            name: Ca last test
            vertical: true
          - type: tile
            entity: sensor.reef_tank_magnesium_days_since
            name: Mg last test
            vertical: true
          - type: tile
            entity: sensor.reef_tank_phosphate_days_since
            name: PO4 last test
            vertical: true
