name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # `aiohttp` is required because icp_importer.py imports it at
        # module level (used by the Triton :1024 API call). HA ships it
        # at runtime; CI has bare Python.
        run: pip install pytest pytest-asyncio aiohttp
      - name: Run tests
        run: pytest tests/
