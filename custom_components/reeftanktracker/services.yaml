record_reading:
  name: Record Reading
  description: >
    Log a parameter reading. Manual entries default to source=manual and
    sample_taken_at=now. ICP imports use source=icp with the canonical
    sample date from the lab report.
  fields:
    parameter:
      name: Parameter
      description: Parameter id (e.g. kh, calcium, phosphate).
      required: true
      example: kh
      selector:
        text:
    value:
      name: Value
      description: Numeric value in the parameter's unit.
      required: true
      example: 8.4
      selector:
        number:
          mode: box
          min: 0
          max: 100000
          step: 0.001
    unit:
      name: Unit
      description: Override the parameter's default unit.
      example: dKH
      selector:
        text:
    method:
      name: Method
      description: Test method label (e.g. Hanna ULR, Salifert, Triton ICP).
      example: Hanna ULR
      selector:
        text:
    source:
      name: Source
      description: Origin of the reading.
      default: manual
      selector:
        select:
          options:
            - manual
            - auto
            - icp
    sample_taken_at:
      name: Sample taken at
      description: >
        ISO 8601 timestamp of when the water was sampled. Defaults to now.
        For ICP imports, use the lab's sample date — not when results landed.
      example: "2026-04-01T08:30:00+10:00"
      selector:
        text:
    test_id:
      name: Test ID
      description: Optional reference to an ICP test (e.g. Triton report ID).
      example: B-KJAZM8
      selector:
        text:
    notes:
      name: Notes
      description: Free-form notes attached to the reading.
      selector:
        text:
          multiline: true

add_inventory:
  name: Add Inventory Item
  description: Add a coral, fish, invert, or other inhabitant to the tank registry.
  fields:
    name:
      name: Name
      required: true
      example: "Acropora millepora"
      selector:
        text:
    category:
      name: Category
      required: true
      selector:
        select:
          options:
            - coral
            - fish
            - invertebrate
            - clam
            - anemone
            - macroalgae
            - other
    type:
      name: Type
      description: Sub-category (SPS / LPS / Soft, Tang, Clownfish, etc.).
      example: SPS
      selector:
        text:
    added_at:
      name: Added at
      description: Date added (YYYY-MM-DD). Defaults to today.
      example: "2024-08-15"
      selector:
        text:
    count:
      name: Count
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          step: 1
    notes:
      name: Notes
      selector:
        text:
          multiline: true
    photo:
      name: Photo URL
      description: Optional URL or /local/ path to a photo.
      selector:
        text:

remove_inventory:
  name: Remove Inventory Item
  description: Mark an inventory entry as removed (does not delete history).
  fields:
    id:
      name: Entry ID
      required: true
      selector:
        text:
    removed_at:
      name: Removed at
      description: Date removed (YYYY-MM-DD). Defaults to today.
      selector:
        text:

set_habitat:
  name: Set Tank Context
  description: >
    Update the tank's habitat, current problem, or active test method.
    Method is used as the default label when entering a value via the
    parameter number entities.
  fields:
    habitat:
      name: Habitat
      selector:
        select:
          options:
            - SPS Outer Reef
            - SPS Inner Reef
            - Mixed Reef
            - LPS Dominant
            - Soft Coral Dominant
            - Reef Aquarium with Clam
            - Fish Only
            - NPS (Filter Feeders)
            - Seagrass
    problem:
      name: Problem
      selector:
        select:
          options:
            - None
            - Cyanobacteria
            - RTN
            - STN
            - Poor growth
            - Poor colour
            - Mortality
            - Nuisance Algae
    method:
      name: Active Test Method
      description: Default method used when entering values via number entities.
      selector:
        select:
          options:
            - Unspecified
            - Hanna ULR
            - Hanna
            - Salifert
            - Red Sea Pro
            - API
            - Tropic Marin
            - Triton ICP
            - Refractometer
            - Probe
            - Other

import_icp:
  name: Import ICP Test
  description: >
    Stash a full ICP test record into the tank's history. Normally
    invoked by the icpimport companion integration; you wouldn't call
    this manually.
  fields:
    test_record:
      name: Test record
      required: true
      description: Full JSON test record (test_id, sample_date, elements, matrix, ...).
      selector:
        object:

backfill_statistics:
  name: Backfill Statistics
  description: >
    Re-import every stored reading into Home Assistant's long-term
    statistics table at its original sample timestamp. Use this once
    after upgrading from a version that didn't write statistics, or
    after manually editing the storage file.

    Without this, historical readings (e.g. imported from Aquarium Log)
    only appear as state changes at "now" — graphs won't show the
    actual time series.
  fields:
    parameter:
      name: Parameter
      description: Limit to one parameter id (e.g. kh, calcium). Empty = all.
      example: kh
      selector:
        text:

diagnose_dashboard:
  name: Diagnose Dashboard
  description: >
    Logs (at WARNING level, visible by default) what the integration
    knows about the auto-installed dashboard — which strategy succeeded,
    what's in the lovelace_dashboards registry, whether the dashboard
    content is on disk. Useful when the dashboard isn't appearing.

regenerate_dashboard:
  name: Regenerate Dashboard
  description: >
    Force a fresh build of the auto-installed Reef Tank dashboard at
    /reef-tank-tracker. Clears the "user-removed" flag, so calling this
    after manually deleting the dashboard will bring it back.

acknowledge_alk_recommendation:
  name: Acknowledge Alk Recommendation
  description: >
    Record that you applied the advisor's current alk dose suggestion
    in your Reefbeat doser. Starts the cooldown so the advisor won't
    re-suggest until enough time passes for the change to settle.
  fields:
    applied_value_mL:
      name: Applied dose (mL/day)
      description: The new daily dose you set in Reefbeat.
      required: true
      example: 2.7
      selector:
        number:
          mode: box
          min: 0
          max: 1000
          step: 0.1
    prev_value_mL:
      name: Previous dose (mL/day)
      description: >
        Optional — the dose you replaced. If omitted, inferred from the
        last persisted snapshot.
      example: 3.0
      selector:
        number:
          mode: box
          min: 0
          max: 1000
          step: 0.1

dismiss_alk_recommendation:
  name: Dismiss Alk Recommendation
  description: >
    Tell the advisor you've seen the current suggestion but won't apply
    it. Starts a shorter cooldown than acknowledge so it doesn't re-fire
    on identical data.
  fields:
    suggested_value_mL:
      name: Dismissed value (mL/day)
      description: Optional — the value you're dismissing, for audit.
      example: 2.7
      selector:
        number:
          mode: box
          min: 0
          max: 1000
          step: 0.1

log_demand_change:
  name: Log Demand Change
  description: >
    Record that the tank's nutrient demand changed (added corals, fish,
    livestock removed, etc.). The advisor truncates its rolling window
    from this point and enters learning mode for a few days before
    issuing a new recommendation, so it doesn't extrapolate from
    pre-event data.
  fields:
    parameter:
      name: Parameter
      description: Parameter id (default kh).
      default: kh
      selector:
        select:
          options:
            - kh
    reason:
      name: Reason
      description: Free-text — what changed.
      required: true
      example: "added 3 SPS frags"
      selector:
        text:
    expected_direction:
      name: Expected direction
      description: Whether you expect demand to rise, fall, or are unsure.
      default: unknown
      selector:
        select:
          options:
            - increase
            - decrease
            - unknown
    magnitude_hint_pct:
      name: Magnitude hint (%)
      description: >
        Optional — your guess of the demand change as a percentage.
        Stored as an attribute; not used in the math.
      example: 10
      selector:
        number:
          mode: box
          min: 0
          max: 100
          step: 1

add_supplement_profile:
  name: Add Supplement Profile
  description: >
    Register a custom alkalinity supplement so it appears in the Alk
    Advisor's Supplement profile dropdown and is matched by auto-detect.
    Vendor-published efficiency is dKH per mL per 100 L (Red Sea
    Foundation B = 0.1; check your supplement's label).
  fields:
    label:
      name: Label
      description: Display name shown in the Options dropdown.
      required: true
      example: "Brightwell Alkalin8.3"
      selector:
        text:
    eff_dkh_per_mL_per_100L:
      name: Efficiency (dKH per mL per 100 L)
      description: >
        Vendor-published potency. e.g. 0.1 means "1 mL per 100 L raises
        alkalinity by 0.1 dKH". For Foundation B that's 0.1.
      required: true
      example: 0.083
      selector:
        number:
          mode: box
          min: 0.001
          max: 5.0
          step: 0.001
    label_patterns:
      name: Label patterns (for auto-detect)
      description: >
        Optional list of lowercase substrings to match against the
        doser's `*_supplement` sensor state. e.g. ["alkalin8"]. Leave
        empty if you'll always pick this profile manually.
      example: '["alkalin8", "alkalin 8"]'
      selector:
        text:
          multiple: true
    notes:
      name: Notes
      description: Free-form. Vendor URL, lot number, mix recipe, etc.
      selector:
        text:
          multiline: true

remove_supplement_profile:
  name: Remove Supplement Profile
  description: >
    Delete a previously-added supplement profile by id. Built-in
    profiles cannot be removed. Get current ids via
    `reeftanktracker.list_supplement_profiles`.
  fields:
    id:
      name: Profile ID
      description: The slug-style id, e.g. brightwell_alkalin8_3.
      required: true
      example: brightwell_alkalin8_3
      selector:
        text:

list_supplement_profiles:
  name: List Supplement Profiles
  description: >
    Logs the merged supplement profile registry (builtins + your
    additions) at WARNING. Use this to find a profile id before calling
    remove_supplement_profile. Output appears in the HA log.

capture_snapshot_now:
  name: Capture Alk Snapshot Now
  description: >
    Capture an alk advisor snapshot. With no arguments, reads the
    current state of the configured KH source and alk heads, stamping
    "now" — useful in prod for a manual baseline (e.g. right after
    calibrating the KH Keeper). With override arguments, persists
    exactly what you pass — useful for seeding synthetic history while
    testing the advisor in a dev instance.
  fields:
    at:
      name: Snapshot timestamp (ISO 8601)
      description: >
        Override the timestamp. Defaults to now. Use this to seed
        historical snapshots when testing.
      example: "2026-04-30T23:55:00+10:00"
      selector:
        text:
    kh:
      name: KH (dKH)
      description: Override the KH value. Defaults to current state of `kh_source`.
      example: 9.08
      selector:
        number:
          mode: box
          min: 0
          max: 20
          step: 0.01
    dose_mL:
      name: Daily dose (mL)
      description: >
        Override the alk dose. Defaults to the sum of `daily_dose`
        across the configured alk heads.
      example: 3.0
      selector:
        number:
          mode: box
          min: 0
          max: 1000
          step: 0.1

import_triton_url:
  name: Import Triton ICP test (URL)
  description: >
    Fetch a public Triton showroom URL, parse the ICP-OES report, and
    record per-element readings + the full test record. Idempotent —
    re-running with the same URL is a no-op (dedupe by test_id).
    On parse failure, an HTML + parse-trace bundle is dumped to
    `<config>/.storage/icpimport_debug/<timestamp>/` for diagnosis.
  fields:
    url:
      name: Triton showroom URL
      description: >
        Public URL of the test result page (e.g.
        https://www.triton-lab.de/en/showroom/icp-oes/229019).
        The numeric id at the end becomes the test_id (prefixed
        `triton-`) so dedupe works on re-imports.
      required: true
      example: "https://www.triton-lab.de/en/showroom/icp-oes/229019"
      selector:
        text:
    sample_date:
      name: Sample date (YYYY-MM-DD)
      description: >
        When the water sample was taken. Triton's public showroom HTML
        doesn't expose this, so pass it explicitly for older imports.
        Defaults to today (UTC) with a logged warning if omitted.
      example: "2026-04-16"
      selector:
        text:

log_water_change:
  name: Log Water Change
  description: >
    Record a water change so the alk advisor doesn't interpret the
    sudden KH shift as a trend. Snapshots within the configured
    settling window after this event are excluded from slope/median
    calculations; the rolling window is otherwise unchanged.
  fields:
    parameter:
      name: Parameter
      default: kh
      selector:
        select:
          options:
            - kh
    percent:
      name: Percent volume changed
      description: e.g. 10 for a 10% water change.
      required: true
      example: 10
      selector:
        number:
          mode: box
          min: 0.1
          max: 100
          step: 0.5
    salt_mix_kh:
      name: Salt mix KH (dKH)
      description: >
        Optional — KH of the new water. Stored as a diagnostic; not
        used in v1 math.
      example: 8.0
      selector:
        number:
          mode: box
          min: 0
          max: 20
          step: 0.05
    notes:
      name: Notes
      description: Free-form (brand, batch, etc.).
      selector:
        text:
          multiline: true
